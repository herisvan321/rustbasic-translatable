[package]
name = "rustbasic-translatable"
version = "0.0.2"
edition = "2024"
build = "build.rs"
description = "Multi-language JSON translation and localization package for the RustBasic Framework."
license = "MIT"
readme = "README.md"
homepage = "https://github.com/herisvan321/rustbasic"
repository = "https://github.com/herisvan321/rustbasic-translatable"
documentation = "https://docs.rs/rustbasic-translatable"
keywords = ["web", "framework", "translation", "localization", "i18n"]
categories = ["web-programming", "localization"]


[lib]
name = "rustbasic_translatable"
path = "src/lib.rs"

[dependencies]
rustbasic-core = "0.1"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.140"
tokio = { version = "1.52.1", features = ["full"] }
axum = "0.8.9"
once_cell = "1.20.2"
tracing = "0.1.44"

[build-dependencies]
# Standard build deps if needed, but standard library is enough!
